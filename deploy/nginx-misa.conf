# Include these locations inside the lab14.io.vn server block.
location = /misa {
    return 308 https://$host/misa/$is_args$args;
}

location /misa/ {
    if ($http_x_forwarded_proto = "http") {
        return 308 https://$host$request_uri;
    }

    set $backend_misa misa-amis;
    rewrite ^/misa/(.*) /$1 break;
    resolver 127.0.0.11 ipv6=off valid=30s;
    proxy_pass http://$backend_misa:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $http_cf_connecting_ip;
    proxy_set_header X-Forwarded-For $http_cf_connecting_ip;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Prefix /misa;
    proxy_connect_timeout 10s;
    proxy_send_timeout 100s;
    proxy_read_timeout 100s;
    client_max_body_size 32k;
}
